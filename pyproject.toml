[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-gmgn-data"
version = "0.1.0"
description = "Base de dados GMGN auditavel e isolada."
requires-python = ">=3.13,<3.14"
dependencies = [
  "asyncpg==0.31.0", "duckdb==1.5.5", "fastapi==0.141.1",
  "httpx==0.28.1", "nats-py==2.15.0", "pydantic==2.13.5",
  "uvicorn==0.52.4", "pytz==2026.3.post1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["midas_data*"]

[tool.setuptools.package-data]
midas_data = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: real isolated Docker foundation behavior"]
